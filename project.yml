name: IBKRWidget
options:
  bundleIdPrefix: com.ou
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # set DEVELOPMENT_TEAM in the environment when generating: DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Debug:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES   # get-task-allow, so Xcode can attach the debugger
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO    # no debugger may attach to a process holding the decrypted secret
packages:
  BigInt:
    url: https://github.com/attaswift/BigInt
    from: 5.3.0
targets:
  IBKRWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleName: Folio
        CFBundleIconFile: AppIcon
        # read from build settings so scripts/release.sh can set the version per release
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSUIElement: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: IBKR credentials folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.folder, public.data]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.ou.ibkrwidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ou.ibkrwidget
        PRODUCT_NAME: Folio
    dependencies:
      - target: IBKRWidgetExtension
      - package: BigInt
  IBKRWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: {NSExtensionPointIdentifier: com.apple.widgetkit-extension}
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.ou.ibkrwidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ou.ibkrwidget.widget
